name: oidctarget
on:
  workflow_dispatch:
  pull_request_target:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        run: |
          TOK=$(curl -s "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=b74-hunt" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "$TOK" | python3 -c 'import base64,json,sys;p=sys.stdin.read().strip().split(".")[1];p+="="*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));keys=["iss","aud","sub","repository","repository_owner","ref","sha","actor","actor_id","job_workflow_ref","run_id","prn","event_name","head_ref","base_ref"];print("CLAIMS:", json.dumps({k:d.get(k) for k in keys}))'
