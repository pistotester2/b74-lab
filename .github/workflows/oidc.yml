name: oidc
on:
  workflow_dispatch:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        env:
          REQ_URL: ${{ ACTIONS_ID_TOKEN_REQUEST_URL }}
          REQ_TOKEN: ${{ ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOK=$(curl -s "${REQ_URL}&audience=b74-hunt" -H "Authorization: Bearer $REQ_TOKEN" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          python3 - "$TOK" <<'PYEOF'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          keys = ['iss','aud','sub','repository','repository_owner','ref','sha','actor','actor_id','job_workflow_ref','job_workflow_sha','run_id','prn','event_name','head_ref','base_ref']
          print('CLAIMS:', json.dumps({k: d.get(k) for k in keys}))
          PYEOF
