name: oidc
on:
  workflow_dispatch:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        run: |
          echo "URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          RESP=$(curl -s -w "\nHTTPSTATUS:%{http_code}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=b74-hunt" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          echo "$RESP" | grep HTTPSTATUS
          echo "$RESP" | grep -v HTTPSTATUS | head -c 200
          echo
